name: CI
on:
  push:
  pull_request:
jobs:
  check:
    # Two CPU architectures on purpose: libvips is not bit-exact across x64 and arm64 (incident I-7),
    # and the golden suite must prove its pixel tolerance covers the difference on every push.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.21.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:full
